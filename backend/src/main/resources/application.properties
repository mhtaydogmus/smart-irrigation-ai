spring.application.name=smart-irrigation-backend
server.port=8080
spring.task.scheduling.pool.size=2

# --- AI Service Layer (Python FastAPI edge vision service) ---
ai.service.url=http://localhost:8000
ai.service.connect-timeout=3s
ai.service.read-timeout=30s

# --- Capture mode (FOLDER = drag-and-drop prototype, CAMERA = USB webcam) ---
capture.mode=${CAPTURE_MODE:FOLDER}

# --- Folder watcher (empty directory = <repo root>/test-images) ---
watcher.directory=
watcher.poll-interval-ms=1500

# --- System state lock ---
system.lock.timeout=45s
system.lock.failsafe-check-interval-ms=10000

# --- Decision engine ---
decision.flow-rate-ml-per-sec=10

# --- MQTT ---
mqtt.enabled=false
mqtt.broker.url=tcp://localhost:1883
mqtt.topic.command=agri/device/command
mqtt.client-id=smart-irrigation-backend
